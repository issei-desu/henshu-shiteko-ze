<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>素人が作った編集アプリ</title>
  <meta name="theme-color" content="#1a1a22" />
  <link rel="manifest" href="manifest.json" />
  <link rel="stylesheet" href="style.css?v=20261022_04" />
</head>
<body>
  <div class="app-container">
    <!-- サイドバー（Grid 3段構造：ヘッダー / スクロールリスト / 下部設定） -->
    <aside class="sidebar">
      <div class="sidebar-header">
        <div class="title-row">
          <h2>素材レイヤー管理</h2>
          <span class="layer-hint">上: 最背面 / 下: 最前面</span>
        </div>
        <div class="project-toolbar">
          <button id="saveProjectBtn" type="button" class="btn white-mini-btn" title="編集内容をファイルに保存">保存</button>
          <label class="btn white-mini-btn" title="保存したプロジェクトファイルを開く">
            開く
            <input type="file" id="loadProjectInput" accept=".json" hidden />
          </label>
          <button id="resetProjectBtn" type="button" class="btn white-mini-btn danger-btn" title="編集内容を初期化">クリア</button>
          <span id="saveBadge" class="save-badge">自動保存中</span>
        </div>
        <div class="add-btn-group">
          <label class="btn white-btn add-btn">
            ＋ 素材を追加 (画像/動画)
            <input type="file" id="assetInput" accept="image/*,video/*" multiple hidden />
          </label>
          <button id="addTextBtn" type="button" class="btn white-btn add-btn">
            ＋ テキストを追加
          </button>
        </div>
      </div>

      <!-- レイヤー一覧（強制縦スクロールエリア） -->
      <div id="layerList" class="layer-list"></div>

      <!-- 下部アクションバー (動画枠サイズ & 保存トリガーボタン) -->
      <div class="export-panel">
        <div class="aspect-control">
          <label for="aspectSelect">動画枠サイズ (アスペクト比):</label>
          <select id="aspectSelect">
            <option value="1920x1080">16:9 (横動画 / YouTube 1920x1080)</option>
            <option value="1080x1920">9:16 (縦動画 / Shorts, TikTok 1080x1920)</option>
            <option value="1080x1080">1:1 (正方形 / Instagram 1080x1080)</option>
            <option value="1440x1080">4:3 (スタンダード 1440x1080)</option>
          </select>
        </div>

        <div class="button-group">
          <button id="openExportModalBtn" type="button" class="btn white-btn-record" onclick="if(typeof openExportModal==='function')openExportModal();">
            動画・画像を保存 (書き出し)
          </button>
        </div>
        <div id="recordStatus" class="record-status"></div>

        <!-- iPhone / スマホ用 カメラロール保存アクションエリア -->
        <div id="shareActionArea" class="share-action-area" style="display: none;">
          <button id="saveToPhotosBtn" type="button" class="btn camera-roll-btn">
            iPhoneカメラロールに保存 (共有)
          </button>
          <div class="share-tip">※タップすると共有メニューが開き「ビデオを保存」または「画像を保存」で写真アプリに追加できます</div>
          <div id="imagePreviewArea" class="image-preview-area" style="display: none;"></div>
        </div>
      </div>
    </aside>

    <!-- 保存モーダルダイアログ (クリック時に開く) -->
    <div id="exportModal" class="modal-overlay" style="display: none;">
      <div class="modal-content">
        <div class="modal-header">
          <h3>保存形式と方法を選択</h3>
          <button id="closeExportModalBtn" type="button" class="modal-close-btn">&times;</button>
        </div>

        <div class="modal-body">
          <div class="format-control">
            <label for="formatSelect">保存形式 (フォーマット):</label>
            <select id="formatSelect">
              <option value="mp4">MP4 (.mp4) - 動画</option>
              <option value="webm">WebM (.webm) - 高圧縮動画</option>
              <option value="mkv">MKV (.mkv) - 高画質動画</option>
              <option value="gif">GIF (.gif) - アニメーション</option>
              <option value="png">PNG (.png) - 静止画</option>
              <option value="jpg">JPG (.jpg) - 静止画</option>
            </select>
          </div>

          <!-- 保存方法（3つのモード切替） -->
          <div class="export-mode-control" id="modeControlArea">
            <label>保存方法 (モード):</label>
            <div class="export-mode-tabs">
              <button type="button" class="mode-tab active" data-mode="instant" title="指定秒数をその場ですぐに書き出し">その場で保存</button>
              <button type="button" class="mode-tab" data-mode="timer" title="プレビュー再生しながら指定秒数で自動停止">秒数指定録画</button>
              <button type="button" class="mode-tab" data-mode="manual" title="録画開始から手動停止まで録画保存">自由録画</button>
            </div>
          </div>

          <!-- 秒数範囲指定行（開始秒・終了秒・全体尺ボタン） -->
          <div class="export-duration-row" id="durationSettingRow">
            <div style="display: flex; justify-content: space-between; align-items: baseline;">
              <label>保存する区間 (開始〜終了秒):</label>
              <button type="button" id="useTimelineMaxBtn" class="btn btn-xs" title="素材全体の長さに合わせる">全体尺に合わせる</button>
            </div>
            <div class="duration-range-wrap">
              <div class="range-field">
                <span class="range-sublabel">開始:</span>
                <input type="number" id="exportStartInput" min="0" max="3600" step="0.1" value="0" />
                <span class="unit">秒</span>
              </div>
              <span class="range-sep">〜</span>
              <div class="range-field">
                <span class="range-sublabel">終了:</span>
                <input type="number" id="exportEndInput" min="0.1" max="3600" step="0.1" value="5" />
                <span class="unit">秒</span>
              </div>
            </div>
          </div>
        </div>

        <div class="modal-footer">
          <button id="cancelExportModalBtn" type="button" class="btn white-mini-btn">キャンセル</button>
          <button id="recordBtn" type="button" class="btn white-btn-record modal-exec-btn">保存を実行する</button>
        </div>
      </div>
    </div>
    </aside>

    <!-- プレビューエリア -->
    <main class="preview-area">
      <div class="stage-container">
        <!-- 画面外は黒、画面内（キャンバス）は白 -->
        <div class="canvas-frame" id="canvasFrame">
          <canvas id="previewCanvas" width="1920" height="1080"></canvas>
        </div>

        <!-- プレビュー直下のシークバー＆タイム表示（上段: 再生＋バー / 下段: 秒数表示） -->
        <div class="timeline-bar-area">
          <div class="timeline-top-row">
            <button id="playBtn" type="button" class="btn white-mini-btn">再生</button>
            <input type="range" id="timeSeeker" min="0" max="10" step="0.05" value="0" />
          </div>
          <div class="time-display">
            <span id="currentTimeDisplay">00:00.00</span> / <span id="maxTimeDisplay">00:10.00</span>
          </div>
        </div>
      </div>

    </main>

    <!-- ページ全体の一番下の最終更新日時 -->
    <div class="footer-links">
      <span class="build-timestamp">最終更新: 2026/10/22 16:48</span>
    </div>
  </div>

  <script src="gifshot.min.js"></script>
  <script src="main.js?v=20261020_04"></script>
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js').catch(console.error);
    }
  </script>
</body>
</html>
