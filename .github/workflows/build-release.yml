name: Build & Release Desktop Apps

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build Windows Installer (.exe)
        run: npm run build:win

      - name: Rename installer to standard name if needed
        shell: bash
        run: |
          ls -la dist/
          # MultiTrackVideoEditor Setup 1.0.0.exe を MultiTrackVideoEditor-Setup-1.0.0.exe にリネーム
          if [ -f "dist/MultiTrackVideoEditor Setup 1.0.0.exe" ]; then
            cp "dist/MultiTrackVideoEditor Setup 1.0.0.exe" "dist/MultiTrackVideoEditor-Setup-1.0.0.exe"
          fi

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            dist/MultiTrackVideoEditor-Setup-1.0.0.exe
            dist/MultiTrackVideoEditor Setup 1.0.0.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
