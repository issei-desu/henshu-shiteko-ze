name: Build & Release Desktop Apps

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build Windows Installer with Official Wine Docker
        run: |
          docker run --rm \
            --env GH_TOKEN="${{ secrets.GITHUB_TOKEN }}" \
            --env CSC_IDENTITY_AUTO_DISCOVERY=false \
            --volume "$(pwd)":/project \
            --volume ~/.cache/electron:/root/.cache/electron \
            --volume ~/.cache/electron-builder:/root/.cache/electron-builder \
            electronuserland/builder:wine \
            npx electron-builder --win nsis --x64
          # Dockerコンテナがroot権限で生成したdistファイルの所有権をrunnerに戻す
          sudo chown -R $USER:$USER dist/

      - name: Check and prepare artifacts
        shell: bash
        run: |
          ls -la dist/
          # ShiroutoHenshuuApp.exe を確実に生成・配置
          if [ -f "dist/ShiroutoHenshuuApp.exe" ]; then
            echo "ShiroutoHenshuuApp.exe is ready."
          else
            for f in dist/*.exe; do
              if [ -f "$f" ]; then
                cp "$f" "dist/ShiroutoHenshuuApp.exe"
                break
              fi
            done
          fi
          ls -la dist/

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            dist/ShiroutoHenshuuApp.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
