name: Build & Release Desktop Apps

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Disable Windows Defender Realtime Monitoring
        shell: powershell
        run: |
          Set-MpPreference -DisableRealtimeMonitoring $true -ErrorAction SilentlyContinue
          Add-MpPreference -ExclusionPath "$env:GITHUB_WORKSPACE" -ErrorAction SilentlyContinue

      - name: Install dependencies
        run: npm ci

      - name: Build Windows Installer (.exe)
        run: npm run build:win
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: Check and prepare artifacts
        shell: bash
        run: |
          ls -la dist/
          # Setup exe をハイフン区切り名にコピー/標準化
          for f in dist/*Setup*.exe; do
            if [ -f "$f" ]; then
              base=$(basename "$f")
              newname=$(echo "$base" | tr ' ' '-')
              if [ "$base" != "$newname" ]; then
                cp "$f" "dist/$newname"
              fi
            fi
          done
          ls -la dist/

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            dist/*.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
